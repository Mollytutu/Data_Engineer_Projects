name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pipeline harness
        run: bash scripts/run_harness.sh

  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run project watchdog
        run: bash scripts/run_watchdog.sh
      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-pipeline-watchdog-report
          path: watchdog/reports/latest.md
